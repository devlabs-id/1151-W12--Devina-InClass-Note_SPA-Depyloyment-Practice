<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="1740" viewBox="0 0 900 1740"
     role="img" aria-labelledby="title description">

  <title id="title">BNA Week 12 — Analytical Thinking and BNA Agent Process</title>
  <desc id="description">
    A portrait process diagram connecting project definition, PRD and MVP
    scope, evidence collection, the three-step analytical method, insights,
    and evaluation. Market considerations are shown as provisional.
  </desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10"
            refX="8" refY="5" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 8 5 L 1 9"
            fill="none" stroke="#71869A" stroke-width="1.8"/>
    </marker>

    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #293D50;
      }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #607487; }
      .section { font-size: 19px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #607487; }
      .label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #607487;
      }
      .step-title { font-size: 19px; font-weight: 700; }
      .number { font-size: 18px; font-weight: 700; fill: #426C91; }
      .connector {
        fill: none;
        stroke: #71869A;
        stroke-width: 1.8;
        marker-end: url(#arrow);
      }
      .card { stroke: #D5E0E8; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="1740" fill="#FAFCFE"/>

  <!-- Header -->
  <text x="450" y="57" text-anchor="middle" class="label">
    BUSINESS NEWS AND ANALYSIS · WEEK 12
  </text>
  <text x="450" y="100" text-anchor="middle" class="title">
    BNA Agent: From Questions to Insights
  </text>
  <text x="450" y="132" text-anchor="middle" class="subtitle">
    Systematic · Structured · Process-oriented
  </text>

  <!-- 1. Project definition -->
  <rect x="70" y="166" width="760" height="128" rx="16"
        fill="#F0F5FA" class="card"/>
  <text x="94" y="193" class="label">01 · DEFINE THE PROJECT</text>
  <text x="94" y="224" class="section">Establish purpose and analytical focus</text>
  <text x="94" y="254" class="body">
    TP: Build a BNA Agent for the chosen company.
  </text>
  <text x="94" y="279" class="body">
    Focus: Analyze company-related news and analysis.
  </text>

  <path d="M450 295 V321" class="connector"/>

  <!-- 2. Requirements and scope -->
  <rect x="70" y="330" width="760" height="142" rx="16"
        fill="#F5F2FA" class="card"/>
  <text x="94" y="357" class="label">02 · DEFINE REQUIREMENTS AND SCOPE</text>

  <text x="94" y="389" class="section">PRD</text>
  <text x="94" y="415" class="body">Product Requirements Document</text>
  <text x="94" y="444" class="small">
    Define needs, inputs, outputs and success criteria.
  </text>

  <line x1="450" y1="379" x2="450" y2="451"
        stroke="#DDD7E8" stroke-width="1.2"/>

  <text x="474" y="389" class="section">MVP</text>
  <text x="474" y="415" class="body">Minimum Viable Product</text>
  <text x="474" y="444" class="small">
    Select essential initial functionality.
  </text>

  <path d="M450 473 V499" class="connector"/>

  <!-- 3. Inputs -->
  <rect x="70" y="508" width="760" height="108" rx="16"
        fill="#F0F7F5" class="card"/>
  <text x="94" y="535" class="label">03 · COLLECT RELEVANT MATERIAL</text>
  <text x="94" y="566" class="section">Gather news and analysis about the company</text>
  <text x="94" y="594" class="body">
    Organize material so it can support evidence-based investigation.
  </text>

  <path d="M450 617 V643" class="connector"/>

  <!-- 4. Core analytical process -->
  <rect x="70" y="652" width="760" height="424" rx="16"
        fill="#EDF5FC" class="card"/>
  <text x="94" y="679" class="label">04 · APPLY THE CORE ANALYTICAL METHOD</text>

  <!-- Separate -->
  <rect x="94" y="700" width="712" height="98" rx="12"
        fill="#FFFFFF" stroke="#D5E3EF"/>
  <circle cx="125" cy="732" r="18" fill="#E5F0FA"/>
  <text x="125" y="738" text-anchor="middle" class="number">1</text>
  <text x="158" y="738" class="step-title">Separate</text>
  <text x="158" y="765" class="body">
    Distinguish the problem, needs / demand, and questions.
  </text>
  <text x="158" y="787" class="small">
    Result: Clear components and analytical scope.
  </text>

  <path d="M450 799 V817" class="connector"/>

  <!-- Investigate -->
  <rect x="94" y="826" width="712" height="98" rx="12"
        fill="#FFFFFF" stroke="#D5E3EF"/>
  <circle cx="125" cy="858" r="18" fill="#E5F0FA"/>
  <text x="125" y="864" text-anchor="middle" class="number">2</text>
  <text x="158" y="864" class="step-title">Investigate deeply</text>
  <text x="158" y="891" class="body">
    Examine each component and support findings with evidence.
  </text>
  <text x="158" y="913" class="small">
    Result: Evidence-supported findings.
  </text>

  <path d="M450 925 V943" class="connector"/>

  <!-- Recombine -->
  <rect x="94" y="952" width="712" height="98" rx="12"
        fill="#FFFFFF" stroke="#D5E3EF"/>
  <circle cx="125" cy="984" r="18" fill="#E5F0FA"/>
  <text x="125" y="990" text-anchor="middle" class="number">3</text>
  <text x="158" y="990" class="step-title">Recombine</text>
  <text x="158" y="1017" class="body">
    Integrate findings and explain relationships between components.
  </text>
  <text x="158" y="1039" class="small">
    Result: A coherent understanding of the subject.
  </text>

  <path d="M450 1077 V1103" class="connector"/>

  <!-- 5. Outcomes -->
  <rect x="70" y="1112" width="760" height="112" rx="16"
        fill="#EEF8F2" class="card"/>
  <text x="94" y="1139" class="label">05 · PRESENT THE OUTCOME</text>
  <text x="94" y="1172" class="section">New representation → Insights</text>
  <text x="94" y="1202" class="body">
    Present a structured summary, model or diagram of the findings.
  </text>

  <path d="M450 1225 V1251" class="connector"/>

  <!-- 6. Evaluation -->
  <rect x="70" y="1260" width="760" height="164" rx="16"
        fill="#FFF8ED" class="card"/>
  <text x="94" y="1287" class="label">06 · EVALUATE AND REFINE</text>
  <text x="94" y="1320" class="body">
    Effectiveness: Does the result achieve its goal and purpose?
  </text>
  <text x="94" y="1350" class="body">
    Efficiency: Are resources used appropriately?
  </text>
  <text x="94" y="1380" class="small">
    Minimal input does not automatically produce high-quality output.
  </text>
  <text x="94" y="1405" class="small">
    Follow each necessary step and understand the whole process.
  </text>

  <!-- Iterative feedback -->
  <path d="M830 1342 H857 V401 H833"
        fill="none" stroke="#97A9B9" stroke-width="1.5"
        stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="879" y="885" text-anchor="middle"
        transform="rotate(-90 879 885)"
        class="small">
    Refine requirements and process as needed
  </text>

  <!-- Provisional market extension: not a mandatory process step -->
  <rect x="70" y="1460" width="760" height="130" rx="16"
        fill="#F7F5FA" stroke="#CDC5DC" stroke-width="1.2"
        stroke-dasharray="6 4"/>
  <text x="94" y="1487" class="label">
    RELATED TRACK · MARKET CONSIDERATIONS
  </text>
  <text x="94" y="1520" class="body">
    Producers ↔ Market ↔ Consumers
  </text>
  <text x="94" y="1548" class="body">
    Target audience · Product value · WTP (Willingness to Pay)
  </text>
  <text x="94" y="1574" class="small">
    Commercialization: Relevance to the TP remains to be confirmed.
  </text>

  <!-- Notes -->
  <line x1="70" y1="1620" x2="830" y2="1620"
        stroke="#DCE5EC"/>
  <text x="70" y="1647" class="small">
    Diagram basis: Class notes + confirmed clarifications.
  </text>
  <text x="70" y="1672" class="small">
    Project workflow and PRD details are proposed applications of the method.
  </text>
  <text x="70" y="1697" class="small">
    Class-note summarization is a separate example, not a confirmed Agent feature.
  </text>

</svg>
